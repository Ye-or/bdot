- clean:
    - "~"
    - ~/.config
    - ~/.local

- link:
    # Top-level dotfiles
    ~/.zshrc: home/.zshrc
    ~/.zshenv: home/.zshenv
    ~/.zprofile: home/.zprofile
    ~/.zshrc.d: home/.zshrc.d

    # .config/*
    ~/.config/alacritty: home/.config/alacritty
    ~/.config/bottom: home/.config/bottom
    ~/.config/clipcat: home/.config/clipcat
    ~/.config/ghostty: home/.config/ghostty
    ~/.config/niri: home/.config/niri
    ~/.config/nvim: home/.config/nvim
    ~/.config/rofi: home/.config/rofi
    ~/.config/starship.toml: home/.config/starship.toml
    ~/.config/tinted-theming: home/.config/tinted-theming
    ~/.config/waybar: home/.config/waybar
    ~/.config/yazi: home/.config/yazi
    ~/.config/zellij: home/.config/zellij
    ~/.config/swaylock: home/.config/swaylock
    # .local/*
    ~/.local/bin:
      glob: true
      path: home/.local/bin/*
    ~/.local/share/service: home/.local/share/service
    ~/.local/share/tinted-theming/tinty/custom-schemes: home/.local/share/tinted-theming/tinty/custom-schemes
    ~/.local/share/tinted-theming/tinty/custom-templates: home/.local/share/tinted-theming/tinty/custom-templates
- sudo:
    - shell:
        - 
          command: ln -s root/etc/zzz.d/suspend/10-swaylock /etc/zzz.d/suspend/10-swaylock
          stderr: true
