[general]
import = ["./colors.toml"]

[font]
size = 12.0

[selection]
save_to_clipboard = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[scrolling]
history = 100

[window]
opacity = 0.97

[window.padding]
x = 15
y = 5
